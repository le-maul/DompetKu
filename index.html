<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DompetKu - Pencatat Keuangan Sederhana</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>DompetKu</h1>
      <p>Aplikasi Pencatatan Keuangan Personal</p>
    </header>

    <main class="app-main">
      <section class="summary-section">
        <div class="summary-card">
          <span class="card-title">Total Saldo</span>
          <span class="card-value" id="totalBalance">Rp 0</span>
        </div>
        <div class="summary-card income-card">
          <span class="card-title">Total Pemasukan</span>
          <span class="card-value" id="totalIncome">Rp 0</span>
        </div>
        <div class="summary-card expense-card">
          <span class="card-title">Total Pengeluaran</span>
          <span class="card-value" id="totalExpense">Rp 0</span>
        </div>
      </section>

      <section class="form-section">
        <h2>Tambah Transaksi</h2>
        <form id="transactionForm">
          <div class="form-group">
            <label for="description">Keterangan</label>
            <input type="text" id="description" placeholder="Contoh: Gaji, Uang Makan" required>
          </div>
          <div class="form-group">
            <label for="amount">Jumlah (Rp)</label>
            <input type="number" id="amount" min="1" placeholder="0" required>
          </div>
          <div class="form-group">
            <label for="type">Jenis Transaksi</label>
            <select id="type" required>
              <option value="income">Pemasukan</option>
              <option value="expense">Pengeluaran</option>
            </select>
          </div>
          <button type="submit" class="btn-submit">Simpan Transaksi</button>
        </form>
      </section>

      <section class="list-section">
        <h2>Riwayat Transaksi</h2>
        <ul id="transactionList" class="transaction-list">
          <li class="empty-state">Belum ada transaksi.</li>
        </ul>
      </section>
    </main>
  </div>
  
  <div id="snackbar" class="snackbar"></div>
  <script src="script.js"></script>
</body>
</html>
